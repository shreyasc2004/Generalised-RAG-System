[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-rag"
version = "0.1.0"
description = "Local knowledge-folder retrieval with managed Chroma and context-builder connectors"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "filelock>=3.16,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pydantic>=2,<3",
  "tokenizers>=0.13.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

